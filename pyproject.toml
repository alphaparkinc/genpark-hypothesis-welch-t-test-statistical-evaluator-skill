[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-hypothesis-welch-t-test-statistical-evaluator-skill"
version = "1.0.0"
description = "Two-sample Welch's t-test hypothesis evaluator computing Satterthwaite degrees of freedom and two-tailed p-values for A/B testing."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "GenPark AI", email = "engineering@genpark.ai"}]
keywords = ["ai-agent", "mcp", "data-science", "statistics", "zero-dependency"]
dependencies = []

[project.urls]
Homepage = "https://genpark.ai/mcp"
Repository = "https://github.com/alphaparkinc/genpark-hypothesis-welch-t-test-statistical-evaluator-skill"
